name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Daily Brief publishing safeguards
        run: npm run brief:test
      - name: Validate Daily Brief content
        run: npm run brief:validate
      - name: Test paper review history safeguards
        run: npm run paper:test
      - name: Validate paper review content
        run: npm run paper:validate
      - name: Test Knowledge idempotency
        run: npm run knowledge:test
      - name: Validate Knowledge content
        run: npm run knowledge:validate
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_KNOWLEDGE_API_URL: ${{ vars.KNOWLEDGE_API_URL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
