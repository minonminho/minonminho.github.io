name: Update Daily Brief Papers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-paper-briefs.yml"
      - "scripts/paper-reviews/**"
  schedule:
    # 06:00 Korea Standard Time (UTC+9).
    - cron: "0 21 * * *"
    # Weekly Top 10: Tuesday at 07:00 KST, offset from the daily run.
    - cron: "0 22 * * 1"
    # Monthly Top 20: the 7th at 08:00 KST, separated from both other runs.
    - cron: "0 23 6 * *"
  workflow_dispatch:
    inputs:
      cadence:
        description: Which Hugging Face Papers list to update
        required: true
        type: choice
        options:
          - daily
          - weekly
          - monthly
        default: daily
      date:
        description: Optional Korea-local date (YYYY-MM-DD); leave empty for today
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Select update cadence
        id: cadence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CADENCE: ${{ inputs.cadence }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            cadence="${INPUT_CADENCE:-daily}"
          else
            case "$EVENT_SCHEDULE" in
              "0 22 * * 1") cadence="weekly" ;;
              "0 23 6 * *") cadence="monthly" ;;
              *) cadence="daily" ;;
            esac
          fi
          echo "value=$cadence" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/paper-reviews/requirements.txt

      - name: Cache the local translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: papers-en-ko-opus-mt-tc-big-ae8606b7-v1

      - name: Install local translation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.5,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/paper-reviews/requirements.txt

      - name: Fetch and prepare paper briefs
        env:
          PAPER_CADENCE: ${{ steps.cadence.outputs.value }}
          PAPER_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          args=(--cadence "$PAPER_CADENCE")
          if [[ -n "$PAPER_DATE" ]]; then args+=(--date "$PAPER_DATE"); fi
          python scripts/paper-reviews/update-papers.py "${args[@]}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Validate paper content
        run: npm run paper:validate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_TALENT_RADAR_API_URL: ${{ vars.TALENT_RADAR_API_URL }}
          NEXT_PUBLIC_KNOWLEDGE_API_URL: ${{ vars.KNOWLEDGE_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Commit new paper content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/paper-reviews content/daily-brief/highlights
          if git diff --cached --quiet; then
            echo "No new paper summaries or highlights to commit."
          else
            git commit -m "content: update Hugging Face paper briefs"
            git push origin HEAD:main
          fi

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

